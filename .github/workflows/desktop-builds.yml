name: Desktop Builds (Windows + macOS)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish as GitHub release'
        required: false
        default: 'false'

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ./desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies (desktop)
        run: npm ci

      - name: Build Windows installer (NSIS)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --win --x64 --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Foranly-Windows
          path: |
            desktop/dist/Foranly-Setup-*.exe
            desktop/dist/*.7z
          retention-days: 7

  build-macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ./desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies (desktop)
        run: npm ci

      - name: Build macOS dmg
        run: npx electron-builder --mac --x64 --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Foranly-macOS
          path: |
            desktop/dist/Foranly-*.dmg
          retention-days: 7
