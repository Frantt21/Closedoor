name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Pre-flight: los tests de DB/RLS necesitan credenciales reales. Si faltan
      # (p. ej. PR desde un fork, donde GitHub no expone secrets), falla con un
      # mensaje claro en vez de un cascadón de errores 401 confusos.
      - name: Check Supabase secrets
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::Faltan los secrets VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY."
            echo "::error::Configúralos en Settings → Secrets and variables → Actions."
            echo "::error::(Los PR desde forks no reciben secrets → el gate aplica solo a pushes/PRs del repo.)"
            exit 1
          fi
          echo "Secrets OK"

      - name: Run security audit (must be 100%)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: node scripts/test-security-full.mjs

      - name: Verify build still succeeds (CSP meta tag included)
        run: npx vite build
