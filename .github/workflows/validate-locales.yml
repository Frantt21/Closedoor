name: Validate Locales

on:
  push:
    branches: [main]
    paths:
      - 'src/**/*.jsx'
      - 'src/**/*.js'
      - 'src/assets/services/i18n/locales/*.json'
      - 'scripts/validate-locales.mjs'
  pull_request:
    branches: [main]
    paths:
      - 'src/**/*.jsx'
      - 'src/**/*.js'
      - 'src/assets/services/i18n/locales/*.json'
      - 'scripts/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate locales
        run: node scripts/validate-locales.mjs
