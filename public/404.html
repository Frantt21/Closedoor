<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Closedoor</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #0f0f13;
        color: #e0e0e0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100dvh;
        padding: 24px;
      }
      .error-card {
        text-align: center;
        max-width: 420px;
      }
      .error-code {
        font-size: 5rem;
        font-weight: 800;
        color: #e94560;
        line-height: 1;
        margin-bottom: 8px;
      }
      .error-divider {
        width: 48px;
        height: 3px;
        background: #e94560;
        border-radius: 2px;
        margin: 16px auto;
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 600;
        margin-bottom: 12px;
        color: #ffffff;
      }
      p {
        font-size: 0.9rem;
        line-height: 1.6;
        color: #888;
        margin-bottom: 28px;
      }
      .home-btn {
        display: inline-block;
        padding: 10px 28px;
        background: #e94560;
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 0.9rem;
        font-family: inherit;
        text-decoration: none;
        cursor: pointer;
        transition: background 0.2s ease;
      }
      .home-btn:hover {
        background: #d63851;
      }
      .home-btn:active {
        transform: scale(0.97);
      }
    </style>
  </head>
  <body>
    <div class="error-card">
      <div class="error-code">404</div>
      <div class="error-divider"></div>
      <h1>Página no encontrada</h1>
      <p>
        La página que buscas no existe o ha sido movida.
        Verifica la URL o vuelve al inicio.
      </p>
      <a href="/" class="home-btn">Volver al inicio</a>
    </div>
  </body>
</html>
