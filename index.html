<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Closedoor</title>
    <meta name="description" content="Join the community, share your thoughts, and discover new people on Closedoor." />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://app.foranly.space/" />
    <meta property="og:title" content="Closedoor" />
    <meta property="og:description" content="Join the community, share your thoughts, and discover new people on Closedoor." />
    <meta property="og:image" content="https://placehold.co/1200x630/1a1a2e/6b7280?text=Closedoor" />
    <meta property="og:site_name" content="Closedoor" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://app.foranly.space/" />
    <meta name="twitter:title" content="Closedoor" />
    <meta name="twitter:description" content="Join the community, share your thoughts, and discover new people on Closedoor." />
    <meta name="twitter:image" content="https://placehold.co/1200x630/1a1a2e/6b7280?text=Closedoor" />

    <!-- Preconnect to critical origins -->
    <link rel="preconnect" href="https://<TU_PROYECTO>.supabase.co" />
    <link rel="preconnect" href="https://api.foranly.space:24587" />
    <link rel="dns-prefetch" href="https://<TU_PROYECTO>.supabase.co" />
    <link rel="dns-prefetch" href="https://api.foranly.space:24587" />

    <style>
      body { background: #000; }

      #splash-placeholder {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        justify-content: center;
        padding-top: 30px;
        background: #000;
      }
      #splash-placeholder .splash-inner {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #splash-placeholder .splash-logo {
        width: 80px;
        height: 80px;
        object-fit: contain;
        animation: splashPulse 1.5s ease-in-out infinite;
      }
      @keyframes splashPulse {
        0%, 100% { opacity: 0.5; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.08); }
      }
      .js-ready #splash-placeholder {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="splash-placeholder">
      <div class="splash-inner">
        <img src="/logo.svg" alt="Closedoor" class="splash-logo" />
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
