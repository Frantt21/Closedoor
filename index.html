<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Closedoor</title>
    <meta name="description" content="Join the community, share your thoughts, and discover new people on Closedoor." />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://app.foranly.space/" />
    <meta property="og:title" content="Closedoor" />
    <meta property="og:description" content="Join the community, share your thoughts, and discover new people on Closedoor." />
    <meta property="og:image" content="https://placehold.co/1200x630/1a1a2e/e94560?text=Closedoor" />
    <meta property="og:site_name" content="Closedoor" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://app.foranly.space/" />
    <meta name="twitter:title" content="Closedoor" />
    <meta name="twitter:description" content="Join the community, share your thoughts, and discover new people on Closedoor." />
    <meta name="twitter:image" content="https://placehold.co/1200x630/1a1a2e/e94560?text=Closedoor" />

    <!-- Preconnect to critical origins -->
    <link rel="preconnect" href="https://<TU_PROYECTO>.supabase.co" />
    <link rel="preconnect" href="https://api.foranly.space:24587" />
    <link rel="dns-prefetch" href="https://<TU_PROYECTO>.supabase.co" />
    <link rel="dns-prefetch" href="https://api.foranly.space:24587" />

    <!-- ── Hero placeholder: visible immediately, replaces when React mounts ── -->
    <style>
      #hero-placeholder {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 70vh;
        text-align: center;
        padding: 40px 24px;
        max-width: 680px;
        margin: 0 auto;
      }
      #hero-placeholder h1 {
        font-size: 2rem;
        font-weight: 700;
        color: #ffffff;
        margin-bottom: 16px;
        line-height: 1.3;
      }
      #hero-placeholder p {
        font-size: 1rem;
        color: #9ca3af;
        line-height: 1.6;
        margin-bottom: 8px;
      }
      #hero-placeholder .hero-actions {
        display: flex;
        gap: 12px;
        margin-top: 24px;
        flex-wrap: wrap;
        justify-content: center;
      }
      #hero-placeholder .hero-btn {
        display: inline-block;
        padding: 10px 28px;
        border-radius: 8px;
        font-size: 0.9rem;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        text-decoration: none;
        cursor: pointer;
        transition: background 0.2s ease;
      }
      #hero-placeholder .hero-btn--primary {
        background: #e94560;
        color: #fff;
      }
      #hero-placeholder .hero-btn--secondary {
        background: transparent;
        color: #e94560;
        border: 1px solid #e94560;
      }
      @media (max-width: 480px) {
        #hero-placeholder h1 { font-size: 1.6rem; }
        #hero-placeholder p { font-size: 0.9rem; }
      }
      .js-ready #hero-placeholder {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <!-- ── Pre-rendered hero for instant LCP on mobile ── -->
    <div id="hero-placeholder">
      <h1>Post what you want, when you want, where you want.</h1>
      <p>Join the community and share your thoughts with the world.</p>
      <p>Discover new people, follow your interests, and be part of something bigger.</p>
      <div class="hero-actions">
        <a href="/Register" class="hero-btn hero-btn--primary">Get Started</a>
        <a href="/Login" class="hero-btn hero-btn--secondary">Sign In</a>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
